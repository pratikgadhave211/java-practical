    title: "Java Calculator",
    desc: "Captures user input dynamically, processes mathematical expressions using conditional logic and looping constructs with error handling.",
    tags: [["Loops","blue"],["Scanner","orange"],["Try-Catch","purple"]],
    file: "Calculator.java",
    code: `import java.util.Scanner;

public class Calculator {

    // Evaluates a single operation between two numbers
    public static double calculate(double a, double b, char op) {
        switch (op) {
            case '+': return a + b;
            case '-': return a - b;
            case '*': return a * b;
            case '/':
                if (b == 0) throw new ArithmeticException("Division by zero!");
                return a / b;
            case '%':
                if (b == 0) throw new ArithmeticException("Modulo by zero!");
                return a % b;
            default: throw new IllegalArgumentException("Unknown operator: " + op);
        }
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        System.out.println("=== Java Calculator ===");
        System.out.println("Type 'exit' to quit.");

        while (true) {
            System.out.print("\\nEnter expression (e.g. 5 + 3): ");
            String line = sc.nextLine().trim();

            if (line.equalsIgnoreCase("exit")) {
                System.out.println("Goodbye!");
                break;
            }

            try {
                // Parse: number operator number
                String[] parts = line.split("\\\\s+");
                if (parts.length != 3)
                    throw new IllegalArgumentException("Format must be: <num> <op> <num>");

                double a  = Double.parseDouble(parts[0]);
                char   op = parts[1].charAt(0);
                double b  = Double.parseDouble(parts[2]);

                double result = calculate(a, b, op);
                System.out.printf("Result: %.4f%n", result);

            } catch (NumberFormatException e) {
                System.out.println("Error: Invalid number format.");
            } catch (ArithmeticException e) {
                System.out.println("Math Error: " + e.getMessage());
            } catch (IllegalArgumentException e) {
                System.out.println("Input Error: " + e.getMessage());
            }
        }
        sc.close();
    }
}`

    title: "E-Commerce Order System",
    desc: "Order processing with multiple constructors, dynamic product input, total cost computation, discount policies, and invoice generation.",

    code: `import java.util.ArrayList;
import java.util.Scanner;

class Product {
    String name;
    double price;
    int    quantity;
    String category;

    // Constructor 1: name + price only
    Product(String name, double price) {
        this.name     = name;
        this.price    = price;
        this.quantity = 1;
        this.category = "General";
    }

    // Constructor 2: full details
    Product(String name, double price, int quantity, String category) {
        this.name     = name;
        this.price    = price;
        this.quantity = quantity;
        this.category = category;
    }

    double subtotal() { return price * quantity; }
}

public class ECommerceSystem {

    static double applyDiscount(double total) {
        if      (total >= 5000) return total * 0.20;  // 20% off
        else if (total >= 2000) return total * 0.10;  // 10% off
        else if (total >= 1000) return total * 0.05;  //  5% off
        return 0;
    }

    static void printInvoice(ArrayList<Product> cart, String customer) {
        double subtotal = cart.stream().mapToDouble(Product::subtotal).sum();
        double discount = applyDiscount(subtotal);
        double tax      = (subtotal - discount) * 0.18; // 18% GST
        double total    = subtotal - discount + tax;

        System.out.println("\\n╔══════════════════════════════════════════════╗");
        System.out.printf( "║  INVOICE — %-34s║%n", customer);
        System.out.println("╠══════════════════════════════════════════════╣");
        System.out.printf( "║  %-18s %6s %8s %10s ║%n","Item","Qty","Price","Subtotal");
        System.out.println("╠══════════════════════════════════════════════╣");
        for (Product p : cart)
            System.out.printf("║  %-18s %6d %8.2f %10.2f ║%n",
                              p.name, p.quantity, p.price, p.subtotal());
        System.out.println("╠══════════════════════════════════════════════╣");
        System.out.printf( "║  %-30s %14.2f ║%n", "Subtotal:", subtotal);
        System.out.printf( "║  %-30s %14.2f ║%n", "Discount:", -discount);
        System.out.printf( "║  %-30s %14.2f ║%n", "GST (18%):", tax);
        System.out.println("╠══════════════════════════════════════════════╣");
        System.out.printf( "║  %-30s %14.2f ║%n", "TOTAL PAYABLE:", total);
        System.out.println("╚══════════════════════════════════════════════╝");
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);
        ArrayList<Product> cart = new ArrayList<>();

        // Pre-initialised products via different constructors
        cart.add(new Product("Laptop",  55000.00, 1, "Electronics"));
        cart.add(new Product("Pen Drive", 450.00));

        System.out.print("Enter customer name: ");
        String customer = sc.nextLine();

        System.out.print("How many products to add manually? ");
        int n = Integer.parseInt(sc.nextLine().trim());

        for (int i = 0; i < n; i++) {
            System.out.print("  Product name     : "); String name = sc.nextLine();
            System.out.print("  Price            : "); double price = Double.parseDouble(sc.nextLine());
            System.out.print("  Quantity         : "); int qty = Integer.parseInt(sc.nextLine().trim());
            System.out.print("  Category         : "); String cat = sc.nextLine();
            cart.add(new Product(name, price, qty, cat));
        }

        printInvoice(cart, customer);
        sc.close();
    }
}`

    title: "Method Overloading — Power & Absolute Value",
    desc: "Demonstrates method overloading to compute power and absolute value for int, long, float, and double, alongside Math class static methods.",
    tags: [["Method Overloading","blue"],["Math class","orange"],["Static Methods","purple"]],
    file: "MathOperations.java",
    code: `public class MathOperations {

    // ── Overloaded power() ──────────────────────────────────────────
    static int    power(int    base, int exp) { return (int)   Math.pow(base, exp); }
    static long   power(long   base, int exp) { return (long)  Math.pow(base, exp); }
    static float  power(float  base, int exp) { return (float) Math.pow(base, exp); }
    static double power(double base, int exp) { return         Math.pow(base, exp); }

    // ── Overloaded absolute() ───────────────────────────────────────
    static int    absolute(int    n) { return Math.abs(n); }
    static long   absolute(long   n) { return Math.abs(n); }
    static float  absolute(float  n) { return Math.abs(n); }
    static double absolute(double n) { return Math.abs(n); }

    public static void main(String[] args) {

        System.out.println("========== Power Computations ==========");
        System.out.printf("int    2^10   = %d%n",    power(2,    10));
        System.out.printf("long   3L^8   = %d%n",    power(3L,    8));
        System.out.printf("float  2.5f^3 = %.4f%n",  power(2.5f,  3));
        System.out.printf("double 1.5^7  = %.6f%n",  power(1.5,   7));

        System.out.println("\\n--- Math.pow (static method) ---");
        System.out.printf("Math.pow(2, 10)  = %.0f%n", Math.pow(2, 10));
        System.out.printf("Math.pow(3, 8)   = %.0f%n", Math.pow(3, 8));

        System.out.println("\\n======== Absolute Value Computations ========");
        System.out.printf("int    |-42|   = %d%n",    absolute(-42));
        System.out.printf("long   |-999L| = %d%n",    absolute(-999L));
        System.out.printf("float  |-3.7f| = %.2f%n",  absolute(-3.7f));
        System.out.printf("double |-2.718|= %.6f%n",  absolute(-2.71828));

        System.out.println("\\n--- Math.abs (static method) ---");
        System.out.printf("Math.abs(-42)    = %d%n",    Math.abs(-42));
        System.out.printf("Math.abs(-3.7f)  = %.2f%n",  Math.abs(-3.7f));
        System.out.printf("Math.abs(-2.718) = %.6f%n",  Math.abs(-2.71828));
    }
}`

    title: "Array Operations",
    desc: "Displays array elements, finds max/min, calculates sum and average, and performs linear search on a user-provided array.",
    tags: [["Arrays","blue"],["Linear Search","orange"],["Statistics","purple"]],
    file: "ArrayOperations.java",
    code: `import java.util.Scanner;

public class ArrayOperations {

    static void display(int[] arr) {
        System.out.print("Elements : [ ");
        for (int x : arr) System.out.print(x + " ");
        System.out.println("]");
    }

    static int max(int[] arr) {
        int m = arr[0];
        for (int x : arr) if (x > m) m = x;
        return m;
    }

    static int min(int[] arr) {
        int m = arr[0];
        for (int x : arr) if (x < m) m = x;
        return m;
    }

    static long sum(int[] arr) {
        long s = 0;
        for (int x : arr) s += x;
        return s;
    }

    static double average(int[] arr) { return (double) sum(arr) / arr.length; }

    static int search(int[] arr, int target) {
        for (int i = 0; i < arr.length; i++)
            if (arr[i] == target) return i;
        return -1;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.print("Enter array size: ");
        int n = sc.nextInt();
        int[] arr = new int[n];

        System.out.println("Enter " + n + " integers:");
        for (int i = 0; i < n; i++) arr[i] = sc.nextInt();

        System.out.println("\\n========== Array Operations ==========");
        display(arr);
        System.out.println("Maximum  : " + max(arr));
        System.out.println("Minimum  : " + min(arr));
        System.out.println("Sum      : " + sum(arr));
        System.out.printf( "Average  : %.2f%n", average(arr));

        System.out.print("\\nEnter element to search: ");
        int target = sc.nextInt();
        int idx    = search(arr, target);

        if (idx != -1)
            System.out.println(target + " found at index " + idx + ".");
        else
            System.out.println(target + " not found in the array.");

        sc.close();
    }
}`

    code: `// ── Superclass ───────────────────────────────────────────────────
class Animal {
    String name;
    int    age;

    Animal(String name, int age) {
        this.name = name;
        this.age  = age;
    }

    void eat()   { System.out.println(name + " is eating."); }
    void sleep() { System.out.println(name + " is sleeping."); }
    void info()  {
        System.out.println("Name : " + name);
        System.out.println("Age  : " + age);
    }
}

// ── Subclass ─────────────────────────────────────────────────────
class Dog extends Animal {
    String breed;

    Dog(String name, int age, String breed) {
        super(name, age);       // calls Animal constructor
        this.breed = breed;
    }

    void bark()  { System.out.println(name + " says: Woof! Woof!"); }

    // Override info() and extend with breed info
    @Override
    void info() {
        super.info();           // call superclass method
        System.out.println("Breed: " + breed);
    }

    void fetch() { System.out.println(name + " fetches the ball!"); }
}

// ── Main ─────────────────────────────────────────────────────────
public class InheritanceDemo {
    public static void main(String[] args) {

        Animal generic = new Animal("Leo the Lion", 5);
        System.out.println("── Animal ──");
        generic.info();
        generic.eat();
        generic.sleep();

        System.out.println("\\n── Dog (extends Animal) ──");
        Dog dog = new Dog("Buddy", 3, "Golden Retriever");
        dog.info();         // overridden version
        dog.eat();          // inherited
        dog.sleep();        // inherited
        dog.bark();         // own method
        dog.fetch();        // own method
    }
}`

interface Shape {
    double area();
    double perimeter();
    void   describe();       // default implementation allowed in Java 8+
}

// ── Circle ────────────────────────────────────────────────────────
class Circle implements Shape {
    double radius;
    Circle(double r) { this.radius = r; }

    @Override public double area()      { return Math.PI * radius * radius; }
    @Override public double perimeter() { return 2 * Math.PI * radius; }
    @Override public void   describe()  {
        System.out.printf("Circle    | r=%.2f | Area=%.4f | Perimeter=%.4f%n",
                          radius, area(), perimeter());
    }
}

// ── Rectangle ─────────────────────────────────────────────────────
class Rectangle implements Shape {
    double width, height;
    Rectangle(double w, double h) { width = w; height = h; }

    @Override public double area()      { return width * height; }
    @Override public double perimeter() { return 2 * (width + height); }
    @Override public void   describe()  {
        System.out.printf("Rectangle | w=%.2f h=%.2f | Area=%.4f | Perimeter=%.4f%n",
                          width, height, area(), perimeter());
    }
}

// ── Triangle ──────────────────────────────────────────────────────
class Triangle implements Shape {
    double a, b, c;
    Triangle(double a, double b, double c) { this.a=a; this.b=b; this.c=c; }

    @Override public double area() {
        double s = (a+b+c)/2;
        return Math.sqrt(s*(s-a)*(s-b)*(s-c));  // Heron's formula
    }
    @Override public double perimeter() { return a + b + c; }
    @Override public void   describe()  {
        System.out.printf("Triangle  | sides=%.2f,%.2f,%.2f | Area=%.4f | Perimeter=%.4f%n",
                          a, b, c, area(), perimeter());
    }
}

// ── Main ──────────────────────────────────────────────────────────
public class PolymorphismDemo {
    public static void main(String[] args) {
        Shape[] shapes = {
            new Circle(7),
            new Rectangle(5, 10),
            new Triangle(3, 4, 5)
        };

        System.out.println("═══════════ Shape Polymorphism ═══════════");
        for (Shape s : shapes) s.describe();   // runtime polymorphism

        System.out.println("\\nTotal area of all shapes: " +
            String.format("%.4f", java.util.Arrays.stream(shapes)
                                       .mapToDouble(Shape::area).sum()));
    }
}`

        this.balance = balance;
        this.pin     = pin;

import java.util.concurrent.LinkedBlockingQueue;
import java.util.Random;

// Shared message bus
class MessageBus {
    private static final BlockingQueue<String> queue = new LinkedBlockingQueue<>();

    static void send(String msg) {
        queue.add(msg);
        System.out.println("[BUS] " + msg);
    }

    static String receive() throws InterruptedException {
        return queue.poll(100, java.util.concurrent.TimeUnit.MILLISECONDS);
    }
}

// Each user is a thread
class UserThread extends Thread {
    private final String   username;
    private final String[] messages;
    private volatile boolean suspended = false;
    private volatile boolean stopped   = false;

    UserThread(String username, String[] messages, int priority) {
        super(username);
        this.username = username;
        this.messages = messages;
        setPriority(priority);
    }

    // Suspend / resume / stop controls
    synchronized void suspendThread()  { suspended = true;  System.out.println("[" + username + "] Suspended."); }
    synchronized void resumeThread()   { suspended = false; notify(); System.out.println("[" + username + "] Resumed."); }
    void              stopThread()     { stopped = true; interrupt(); }

    @Override
    public void run() {
        Random rng = new Random();
        for (String msg : messages) {
            if (stopped) break;

            synchronized (this) {
                while (suspended) {
                    try { wait(); } catch (InterruptedException e) { return; }
                }
            }

            try {
                Thread.sleep(rng.nextInt(600) + 200);  // simulate typing delay
                MessageBus.send("[" + username + " | P" + getPriority() + "]: " + msg);
            } catch (InterruptedException e) {
                break;
            }
        }
        System.out.println("[" + username + "] went offline.");
    }
}

public class ChatSystem {
    public static void main(String[] args) throws InterruptedException {

        UserThread alice = new UserThread("Alice",
            new String[]{"Hey everyone!", "How's the project going?",
                         "I'll push the update tonight.", "Bye!"},
            Thread.NORM_PRIORITY);

        UserThread bob = new UserThread("Bob",
            new String[]{"Hi Alice!", "Almost done with my module.",
                         "Let's merge tomorrow.", "Later!"},
            Thread.MIN_PRIORITY);

        // High-priority admin thread
        UserThread admin = new UserThread("ADMIN",
            new String[]{"⚠ Server maintenance at 23:00",
                         "✔ Maintenance complete. All systems go."},
            Thread.MAX_PRIORITY);

        System.out.println("═══════ Chat System Started ═══════");
        alice.start();
        bob.start();
        admin.start();

        // Let them chat a bit, then demonstrate suspend/resume on Bob
        Thread.sleep(800);
        bob.suspendThread();
        System.out.println("[Main] Bob paused for 1 second...");
        Thread.sleep(1000);
        bob.resumeThread();

        // Check liveness with isAlive()
        System.out.printf("%n[Main] Alice alive? %b | Bob alive? %b | Admin alive? %b%n",
                          alice.isAlive(), bob.isAlive(), admin.isAlive());

        // Wait for all threads to finish
        alice.join();
        bob.join();
        admin.join();

        System.out.println("\\n[Main] All threads finished. Chat closed.");
        System.out.printf("[Main] Alice alive? %b | Bob alive? %b | Admin alive? %b%n",
                          alice.isAlive(), bob.isAlive(), admin.isAlive());
    }
}`

  // Basic syntax highlight

function show(i) {
  document.querySelectorAll('.assignment').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('p' + i).classList.add('active');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  window.scrollTo({ top: document.querySelector('.nav-wrap').offsetTop - 10, behavior: 'smooth' });
}

function copyCode(btn, i) {
  navigator.clipboard.writeText(assignments[i].code).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<span class="copy-icon">✓</span> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span class="copy-icon">⎘</span> Copy Code';
    }, 2200);
  });
}

// Minimal syntax highlighter
function syntaxHL(code) {
  const KW = ['public','private','protected','static','final','class','interface',
              'abstract','extends','implements','new','return','void','if','else',
              'for','while','do','switch','case','break','continue','default','try',
              'catch','finally','throw','throws','import','package','this','super',
              'null','true','false','instanceof','synchronized','volatile'];
  const TY = ['int','double','float','long','boolean','char','byte','short',
              'String','Scanner','System','Math','Thread','Object'];

  // Comments
  code = code.replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>');
  code = code.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
  // Strings
  code = code.replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
  // Numbers
  code = code.replace(/\b(\d+\.?\d*[fFdDlL]?)\b/g, '<span class="num">$1</span>');
  // Annotations
  code = code.replace(/(@\w+)/g, '<span class="an">$1</span>');
  // Keywords
  KW.forEach(k => {
    code = code.replace(new RegExp(`\\b(${k})\\b`, 'g'), '<span class="kw">$1</span>');
  });
  // Types
  TY.forEach(t => {
    code = code.replace(new RegExp(`\\b(${t})\\b`, 'g'), '<span class="ty">$1</span>');
  });
  // Class-like names
  code = code.replace(/\b([A-Z][A-Za-z0-9]+)\b/g, '<span class="cl">$1</span>');
  return code;
}
