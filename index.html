    title: "Java Calculator",
    desc: "Captures user input dynamically, processes mathematical expressions using conditional logic and looping constructs with error handling.",
    tags: [["Loops","blue"],["Scanner","orange"],["Try-Catch","purple"]],
    file: "Calculator.java",
    code: `import java.util.InputMismatchException;
  import java.util.Scanner;

  public class Calculator {

    static double readNumber(Scanner sc, String prompt) {
      while (true) {
        System.out.print(prompt);
        try {
          return sc.nextDouble();
        } catch (InputMismatchException e) {
          System.out.println("Invalid number. Try again.");
          sc.next();
        }
      }
    }

    public static void main(String[] args) {
      Scanner sc = new Scanner(System.in);

      while (true) {
        System.out.println("\n=== Simple Calculator ===");
        System.out.println("1. Addition (+)");
        System.out.println("2. Subtraction (-)");
        System.out.println("3. Multiplication (*)");
        System.out.println("4. Division (/)");
        System.out.println("5. Modulo (%)");
        System.out.println("0. Exit");
        System.out.print("Enter choice: ");

        int choice;
        try {
          choice = sc.nextInt();
        } catch (InputMismatchException e) {
          System.out.println("Invalid choice. Enter a number.");
          sc.next();
          continue;
        }

        if (choice == 0) {
          System.out.println("Goodbye!");
          break;
        }

        double a = readNumber(sc, "Enter first number : ");
        double b = readNumber(sc, "Enter second number: ");

        double result;
        switch (choice) {
          case 1:
            result = a + b;
            break;
          case 2:
            result = a - b;
            break;
          case 3:
            result = a * b;
            break;
          case 4:
            if (b == 0) {
              System.out.println("Division by zero is not allowed.");
              continue;
            }
            result = a / b;
            break;
          case 5:
            if (b == 0) {
              System.out.println("Modulo by zero is not allowed.");
              continue;
            }
            result = a % b;
            break;
          default:
            System.out.println("Invalid option.");
            continue;
        }

        System.out.println("Result: " + result);
      }

      sc.close();
    }
  }`

  {
    title: "E-Commerce Order System",
    desc: "Order processing with multiple constructors, dynamic product input, total cost computation, discount policies, and invoice generation.",
    tags: [["Constructors","blue"],["OOP","orange"],["Discount Logic","purple"],["Invoice","green"]],
    file: "ECommerceSystem.java",
    code: `import java.util.Scanner;

  class Product {
    String name;
    double price;
    int quantity;
    String category;

    // Constructor 1: name + price (default quantity and category)
    Product(String name, double price) {
      this.name = name;
      this.price = price;
      this.quantity = 1;
      this.category = "General";
    }

    // Constructor 2: full details
    Product(String name, double price, int quantity, String category) {
      this.name = name;
      this.price = price;
      this.quantity = quantity;
      this.category = category;
    }

    double getSubtotal() {
      return price * quantity;
    }
  }

  public class ECommerceSystem {

    static double calculateDiscount(double subtotal) {
      if (subtotal >= 5000) {
        return subtotal * 0.20;
      } else if (subtotal >= 2000) {
        return subtotal * 0.10;
      } else if (subtotal >= 1000) {
        return subtotal * 0.05;
      }
      return 0;
    }

    public static void main(String[] args) {
      Scanner sc = new Scanner(System.in);

      System.out.print("Enter customer name: ");
      String customer = sc.nextLine();

      System.out.print("How many products do you want to add? ");
      int n = Integer.parseInt(sc.nextLine().trim());

      // Create an array large enough for default + user products
      Product[] cart = new Product[n + 2];
      int count = 0;

      // Default products using different constructors
      cart[count++] = new Product("Pen Drive", 450.00);
      cart[count++] = new Product("Notebook", 60.00, 2, "Stationery");

      for (int i = 0; i < n; i++) {
        System.out.println("\nProduct " + (i + 1) + ":");
        System.out.print("  Name     : ");
        String name = sc.nextLine();

        System.out.print("  Price    : ");
        double price = Double.parseDouble(sc.nextLine().trim());

        System.out.print("  Quantity : ");
        int qty = Integer.parseInt(sc.nextLine().trim());

        System.out.print("  Category : ");
        String category = sc.nextLine();

        cart[count++] = new Product(name, price, qty, category);
      }

      double subtotal = 0;
      for (int i = 0; i < count; i++) {
        subtotal += cart[i].getSubtotal();
      }

      double discount = calculateDiscount(subtotal);
      double gst = (subtotal - discount) * 0.18;
      double total = subtotal - discount + gst;

      System.out.println("\n========== INVOICE ==========");
      System.out.println("Customer: " + customer);
      System.out.println("-----------------------------");
      for (int i = 0; i < count; i++) {
        Product p = cart[i];
        System.out.printf("%d) %s  x%d  @ %.2f  = %.2f%n",
            (i + 1), p.name, p.quantity, p.price, p.getSubtotal());
      }
      System.out.println("-----------------------------");
      System.out.printf("Subtotal : %.2f%n", subtotal);
      System.out.printf("Discount : %.2f%n", discount);
      System.out.printf("GST 18%%  : %.2f%n", gst);
      System.out.printf("TOTAL    : %.2f%n", total);

      sc.close();
    }
  }`

  {
    title: "Method Overloading — Power & Absolute Value",
    desc: "Demonstrates method overloading to compute power and absolute value for int, long, float, and double, alongside Math class static methods.",
    tags: [["Method Overloading","blue"],["Math class","orange"],["Static Methods","purple"]],
    file: "MathOperations.java",
    code: `public class MathOperations {

    // Overloaded power() methods (simple loop for int/long)
    static int power(int base, int exp) {
      int result = 1;
      for (int i = 1; i <= exp; i++) {
        result = result * base;
      }
      return result;
    }

    static long power(long base, int exp) {
      long result = 1;
      for (int i = 1; i <= exp; i++) {
        result = result * base;
      }
      return result;
    }

    static float power(float base, int exp) {
      return (float) Math.pow(base, exp);
    }

    static double power(double base, int exp) {
      return Math.pow(base, exp);
    }

    // Overloaded absolute() methods
    static int absolute(int n) {
      return (n < 0) ? -n : n;
    }

    static long absolute(long n) {
      return (n < 0) ? -n : n;
    }

    static float absolute(float n) {
      return (n < 0) ? -n : n;
    }

    static double absolute(double n) {
      return (n < 0) ? -n : n;
    }

    public static void main(String[] args) {
      System.out.println("=== Power (Method Overloading) ===");
      System.out.println("2^5 (int)      = " + power(2, 5));
      System.out.println("3^4 (long)     = " + power(3L, 4));
      System.out.println("2.5^3 (float)  = " + power(2.5f, 3));
      System.out.println("1.5^6 (double) = " + power(1.5, 6));

      System.out.println("\n=== Absolute Value (Method Overloading) ===");
      System.out.println("abs(-10) (int)      = " + absolute(-10));
      System.out.println("abs(-999L) (long)   = " + absolute(-999L));
      System.out.println("abs(-3.7f) (float)  = " + absolute(-3.7f));
      System.out.println("abs(-2.718) (double)= " + absolute(-2.718));
    }
  }`

  {
    title: "Array Operations",
    desc: "Displays array elements, finds max/min, calculates sum and average, and performs linear search on a user-provided array.",
    tags: [["Arrays","blue"],["Linear Search","orange"],["Statistics","purple"]],
    file: "ArrayOperations.java",
    code: `import java.util.Scanner;

public class ArrayOperations {

    static void display(int[] arr) {
        System.out.print("Elements : [ ");
        for (int x : arr) System.out.print(x + " ");
        System.out.println("]");
    }

    static int max(int[] arr) {
        int m = arr[0];
        for (int x : arr) if (x > m) m = x;
        return m;
    }

    static int min(int[] arr) {
        int m = arr[0];
        for (int x : arr) if (x < m) m = x;
        return m;
    }

    static long sum(int[] arr) {
        long s = 0;
        for (int x : arr) s += x;
        return s;
    }

    static double average(int[] arr) { return (double) sum(arr) / arr.length; }

    static int search(int[] arr, int target) {
        for (int i = 0; i < arr.length; i++)
            if (arr[i] == target) return i;
        return -1;
    }

    public static void main(String[] args) {
        Scanner sc = new Scanner(System.in);

        System.out.print("Enter array size: ");
        int n = sc.nextInt();
        int[] arr = new int[n];

        System.out.println("Enter " + n + " integers:");
        for (int i = 0; i < n; i++) arr[i] = sc.nextInt();

        System.out.println("\\n========== Array Operations ==========");
        display(arr);
        System.out.println("Maximum  : " + max(arr));
        System.out.println("Minimum  : " + min(arr));
        System.out.println("Sum      : " + sum(arr));
        System.out.printf( "Average  : %.2f%n", average(arr));

        System.out.print("\\nEnter element to search: ");
        int target = sc.nextInt();
        int idx    = search(arr, target);

        if (idx != -1)
            System.out.println(target + " found at index " + idx + ".");
        else
            System.out.println(target + " not found in the array.");

        sc.close();
    }
}`

    code: `// ── Superclass ───────────────────────────────────────────────────
class Animal {
    String name;
    int    age;

    Animal(String name, int age) {
        this.name = name;
        this.age  = age;
    }

    void eat()   { System.out.println(name + " is eating."); }
    void sleep() { System.out.println(name + " is sleeping."); }
    void info()  {
        System.out.println("Name : " + name);
        System.out.println("Age  : " + age);
    }
}

// ── Subclass ─────────────────────────────────────────────────────
class Dog extends Animal {
    String breed;

    Dog(String name, int age, String breed) {
        super(name, age);       // calls Animal constructor
        this.breed = breed;
    }

    void bark()  { System.out.println(name + " says: Woof! Woof!"); }

    // Override info() and extend with breed info
    @Override
    void info() {
        super.info();           // call superclass method
        System.out.println("Breed: " + breed);
    }

    void fetch() { System.out.println(name + " fetches the ball!"); }
}

// ── Main ─────────────────────────────────────────────────────────
public class InheritanceDemo {
    public static void main(String[] args) {

        Animal generic = new Animal("Leo the Lion", 5);
        System.out.println("── Animal ──");
        generic.info();
        generic.eat();
        generic.sleep();

        System.out.println("\\n── Dog (extends Animal) ──");
        Dog dog = new Dog("Buddy", 3, "Golden Retriever");
        dog.info();         // overridden version
        dog.eat();          // inherited
        dog.sleep();        // inherited
        dog.bark();         // own method
        dog.fetch();        // own method
    }
}`

    code: `// Interface
  interface Shape {
    double area();
    double perimeter();
  }

  // Circle class
  class Circle implements Shape {
    double radius;

    Circle(double radius) {
      this.radius = radius;
    }

    public double area() {
      return Math.PI * radius * radius;
    }

    public double perimeter() {
      return 2 * Math.PI * radius;
    }

      return length * width;
    }

  class Triangle implements Shape {
    double a, b, c;

    Triangle(double a, double b, double c) {
      this.a = a;
      this.b = b;
      this.c = c;
    }

    public double perimeter() {
      return a + b + c;
    }

    public double area() {
      double s = perimeter() / 2;
      return Math.sqrt(s * (s - a) * (s - b) * (s - c));
    }
  }

      shapes[2] = new Triangle(3, 4, 5);

      for (int i = 0; i < shapes.length; i++) {
        Shape s = shapes[i];
        System.out.printf("Shape %d | Area = %.2f | Perimeter = %.2f%n",
            (i + 1), s.area(), s.perimeter());
        totalArea += s.area();
      }

      System.out.printf("Total Area = %.2f%n", totalArea);
    }

      this.owner = owner;
      this.balance = balance;
      this.pin = pin;

      return pin == attempt;
    }

      return owner;

      if (amount <= 0) {

      if (amount <= 0) {

      }
      balance = balance - amount;

  public class ATMSimulation {

    }

      while (true) {
        System.out.print(prompt);

  class UserThread extends Thread {
    private String username;
    private String[] messages;

    // Simple control flags
    private volatile boolean paused = false;
    private volatile boolean running = true;

    UserThread(String username, String[] messages, int priority) {
      this.username = username;
      this.messages = messages;
      setName(username);
      setPriority(priority);
    }

    void pauseUser() {
      paused = true;
    }

    void resumeUser() {
      paused = false;
    }

    void stopUser() {
      running = false;
    }

    public void run() {
      for (int i = 0; i < messages.length; i++) {
        if (!running) {
          break;
        }

        while (paused) {
          try {
            Thread.sleep(100);
          } catch (InterruptedException e) {
            return;
          }
        }

        System.out.println("[" + username + " | P" + getPriority() + "] : " + messages[i]);

        try {
          Thread.sleep(300);
        } catch (InterruptedException e) {
          break;
        }
      }

      System.out.println("[" + username + "] finished.");
    }
  }

    public static void main(String[] args) throws InterruptedException {
      UserThread alice = new UserThread(
          "Alice",
          new String[]{"Hello!", "How are you?", "Working on practical.", "Bye!"},
          Thread.NORM_PRIORITY);

      UserThread bob = new UserThread(
          "Bob",
          new String[]{"Hi!", "I am fine.", "Let's submit today.", "See you."},
          Thread.MIN_PRIORITY);

      UserThread admin = new UserThread(
          "Admin",
          new String[]{"Notice: Lab will close at 5 PM.", "Reminder: Save your work."},
          Thread.MAX_PRIORITY);

      alice.start();
      bob.start();
      admin.start();

      System.out.println("Bob alive?   " + bob.isAlive());
      System.out.println("Admin alive? " + admin.isAlive());

const nav  = document.getElementById('nav');
const main = document.getElementById('main');

assignments.forEach((a, i) => {
  // Nav button
  const btn = document.createElement('button');
  btn.className  = 'nav-btn' + (i===0 ? ' active' : '');
  btn.textContent = `P${i+1}. ${a.title}`;
  btn.onclick = () => show(i);
  nav.appendChild(btn);

  // Card
  const section = document.createElement('div');
  section.className = 'assignment' + (i===0 ? ' active' : '');
  section.id = 'p' + i;

  const tagHTML = a.tags.map(([t,c]) => `<span class="tag tag-${c}">${t}</span>`).join('');

  // Escape code for HTML display
  const escaped = a.code
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');

  // Basic syntax highlight
  const highlighted = syntaxHL(escaped);

  section.innerHTML = `
    <div class="card-header">
      <div class="problem-num">${String(i+1).padStart(2,'0')}</div>
      <div class="card-meta">
        <h2>${a.title}</h2>
        <p>${a.desc}</p>
        <div class="tags">${tagHTML}</div>
      </div>
    </div>
    <div class="code-wrap">
      <div class="code-toolbar">
        <div class="window-dots">
          <span class="dot dot-red"></span>
          <span class="dot dot-yellow"></span>
          <span class="dot dot-green"></span>
        </div>
        <span class="file-name">${a.file}</span>
        <button class="copy-btn" onclick="copyCode(this, ${i})">
          <span class="copy-icon">⎘</span> Copy Code
        </button>
      </div>
      <pre><code>${highlighted}</code></pre>
    </div>`;

  main.appendChild(section);
});

function show(i) {
  document.querySelectorAll('.assignment').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
  document.getElementById('p' + i).classList.add('active');
  document.querySelectorAll('.nav-btn')[i].classList.add('active');
  window.scrollTo({ top: document.querySelector('.nav-wrap').offsetTop - 10, behavior: 'smooth' });
}

function copyCode(btn, i) {
  navigator.clipboard.writeText(assignments[i].code).then(() => {
    btn.classList.add('copied');
    btn.innerHTML = '<span class="copy-icon">✓</span> Copied!';
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = '<span class="copy-icon">⎘</span> Copy Code';
    }, 2200);
  });
}

// Minimal syntax highlighter
function syntaxHL(code) {
  const KW = ['public','private','protected','static','final','class','interface',
              'abstract','extends','implements','new','return','void','if','else',
              'for','while','do','switch','case','break','continue','default','try',
              'catch','finally','throw','throws','import','package','this','super',
              'null','true','false','instanceof','synchronized','volatile'];
  const TY = ['int','double','float','long','boolean','char','byte','short',
              'String','Scanner','System','Math','Thread','Object'];

  // Comments
  code = code.replace(/(\/\/[^\n]*)/g, '<span class="cm">$1</span>');
  code = code.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="cm">$1</span>');
  // Strings
  code = code.replace(/(&quot;[^&]*?&quot;)/g, '<span class="str">$1</span>');
  // Numbers
  code = code.replace(/\b(\d+\.?\d*[fFdDlL]?)\b/g, '<span class="num">$1</span>');
  // Annotations
  code = code.replace(/(@\w+)/g, '<span class="an">$1</span>');
  // Keywords
  KW.forEach(k => {
    code = code.replace(new RegExp(`\\b(${k})\\b`, 'g'), '<span class="kw">$1</span>');
  });
  // Types
  TY.forEach(t => {
    code = code.replace(new RegExp(`\\b(${t})\\b`, 'g'), '<span class="ty">$1</span>');
  });
  // Class-like names
  code = code.replace(/\b([A-Z][A-Za-z0-9]+)\b/g, '<span class="cl">$1</span>');
  return code;
}
